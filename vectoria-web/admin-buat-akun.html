<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Portal Admin Registrasi Vectoria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">
    
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl text-center max-w-md w-full border border-gray-700">
        <h1 class="text-2xl font-bold mb-2 text-blue-400">Portal Registrasi Admin</h1>
        <p class="text-sm text-gray-400 mb-6">Gunakan portal ini untuk membuatkan akun pembeli baru secara manual dengan password default.</p>
        
        <button onclick="netlifyIdentity.open('signup')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg mb-4">
            Buka Form Buat Akun Pembeli
        </button>

        <a href="index.html" class="text-sm text-gray-400 hover:text-white underline">Kembali ke Web Utama</a>
    </div>

    <script>
        // Pastikan widget aktif di mode signup (pendaftaran)
        netlifyIdentity.on('init', user => {
            if (!user) {
                netlifyIdentity.on('login', () => {
                    netlifyIdentity.logout(); // Langsung logout agar admin bisa mendaftarkan orang lain lagi
                    alert("Akun pembeli berhasil dibuat! Silakan berikan email dan password default ke pembeli.");
                });
            }
        });
    </script>
</body>
</html>
